# Fallback for regenerating the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`),
# should ScrollApp.xcodeproj ever fail to open. Same target and settings.
name: ScrollApp
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ScrollApp:
    type: application
    platform: iOS
    sources: [ScrollApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wardar.scrollapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: ScrollApp
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
